version: "3.8"

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: django_todo_app
    ports:
      - "8011:8011"
    env_file:
      - .env
    command: python manage.py runserver 0.0.0.0:8011
    restart: unless-stopped
    depends_on:
      - db

  db:
    image: postgres:14
    container_name: postgres_todo_db
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypass
      POSTGRES_DB: mydb
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: unless-stopped

  nginx:
    image: nginx:latest
    container_name: nginx_todo
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.config:/etc/nginx/conf.d/default.conf
      - ./todolist/todo/static:/var/www/static
    depends_on:
      - web

volumes:
  db_data: